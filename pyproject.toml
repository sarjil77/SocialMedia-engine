[project]
name = "bakery-social-engine"
version = "0.1.0"
description = "Automated bakery social media pipeline — Telegram ingestion → AI analysis → media processing → Instagram publishing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "python-telegram-bot[job-queue]>=21.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-genai>=1.0",
    "ffmpeg-python>=0.2.0",
    "rembg[cpu]>=2.0.57",
    "Pillow>=10.4",
    "edge-tts>=6.1",
    "cloudinary>=1.41",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "aiosqlite>=0.20",
    "aiohttp>=3.10",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
